<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- MBIYO REAL-ESTATE Emblem SVG -->
  <!-- Africa Map Silhouette with Gorilla Profile and Skyscrapers -->
  <g id="mbiyo-logo-mark">
    <!-- Africa Outline & Dark Green Fill -->
    <path d="M 175 100 
             C 210 90, 240 100, 260 115
             C 290 110, 340 120, 370 145
             C 400 170, 420 200, 430 240
             C 425 260, 400 280, 405 310
             C 410 325, 428 335, 425 350
             C 420 375, 395 380, 390 400
             C 385 415, 390 425, 385 440
             C 375 465, 360 490, 335 500
             C 305 510, 280 480, 265 440
             C 255 410, 250 380, 230 350
             C 210 330, 180 320, 160 300
             C 140 280, 110 260, 100 230
             C 90 190, 110 160, 130 140
             C 150 120, 160 110, 175 100 Z" 
          fill="#16381E" />
    
    <!-- Madagascar Island -->
    <path d="M 440 370 C 445 365, 452 375, 450 395 C 448 415, 440 435, 432 445 C 426 440, 430 420, 434 400 Z" fill="#16381E" />
  </g>

  <!-- Gorilla & Architecture Highlights in Off-White/Gold Cutouts -->
  <g id="gorilla-and-buildings">
    <!-- Gorilla Head Silhouetted on West Africa (left side) -->
    <!-- Brow & Crown -->
    <path d="M 125 150 C 135 130, 160 120, 185 125 C 170 135, 160 150, 155 165 C 145 155, 135 150, 125 150 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- Gorilla Face Lines & Eye -->
    <path d="M 140 170 C 150 165, 165 170, 175 180 C 160 185, 150 195, 145 210 C 135 195, 132 180, 140 170 Z" fill="#FFFFFF" opacity="0.9" />
    <circle cx="160" cy="180" r="4" fill="#16381E" />
    <!-- Muzzle / Jaw -->
    <path d="M 135 220 C 145 215, 165 220, 180 235 C 165 245, 145 250, 130 240 C 128 230, 130 225, 135 220 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- Modern Skyscraper / Building Complex (Center-Right) -->
    <!-- Main Tower -->
    <rect x="225" y="150" width="105" height="180" rx="3" fill="#16381E" stroke="#FFFFFF" stroke-width="7" />
    <!-- Building Windows Grid -->
    <g fill="#FFFFFF">
      <rect x="240" y="170" width="20" height="22" rx="2" />
      <rect x="270" y="170" width="20" height="22" rx="2" />
      <rect x="300" y="170" width="20" height="22" rx="2" />

      <rect x="240" y="205" width="20" height="22" rx="2" />
      <rect x="270" y="205" width="20" height="22" rx="2" />
      <rect x="300" y="205" width="20" height="22" rx="2" />

      <rect x="240" y="240" width="20" height="22" rx="2" />
      <rect x="270" y="240" width="20" height="22" rx="2" />
      <rect x="300" y="240" width="20" height="22" rx="2" />

      <rect x="240" y="275" width="20" height="22" rx="2" />
      <rect x="270" y="275" width="20" height="22" rx="2" />
      <rect x="300" y="275" width="20" height="22" rx="2" />
    </g>
    
    <!-- Secondary Curved High-Rise (Left of main tower) -->
    <path d="M 180 210 L 225 180 L 225 330 L 180 330 Z" fill="#16381E" stroke="#FFFFFF" stroke-width="6" />
    <line x1="195" y1="220" x2="195" y2="310" stroke="#FFFFFF" stroke-width="4" />
    <line x1="210" y1="210" x2="210" y2="310" stroke="#FFFFFF" stroke-width="4" />
  </g>

  <!-- Base Pillar & Typography Box -->
  <g id="brand-text-block">
    <rect x="200" y="325" width="155" height="12" fill="#FFFFFF" />
    <!-- MBIYO Bold Text -->
    <text x="277" y="380" font-family="'Hanken Grotesk', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MBIYO</text>
    <!-- REAL-ESTATE Subtext -->
    <text x="277" y="412" font-family="'Inter', sans-serif" font-weight="700" font-size="22" fill="#C5A059" text-anchor="middle" letter-spacing="4">REAL-ESTATE</text>
  </g>
</svg>
